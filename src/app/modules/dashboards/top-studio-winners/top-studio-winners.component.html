<div class="mat-elevation-z8" style="height: 100%;">
    <h2 class="mt-2 ms-3 mb-0">Top 3 studios with winners</h2>
    
    <table mat-table [dataSource]="dataValues" matSort (matSortChange)="sortData($event)">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="name"> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>
  
      <ng-container matColumnDef="winCount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="winCount"> Win Count </th>
        <td mat-cell *matCellDef="let element"> {{element.winCount}} </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
