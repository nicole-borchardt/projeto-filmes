<div class="mat-elevation-z8">
    <h2 class="mt-2 ms-3 mb-0">List years with multiple winners</h2>
    
    <table mat-table [dataSource]="dataValues" matSort (matSortChange)="sortData($event)">
      <ng-container matColumnDef="year">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="year"> Year </th>
        <td mat-cell *matCellDef="let element"> {{element.year}} </td>
      </ng-container>
  
      <ng-container matColumnDef="winnerCount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="winnerCount"> Win Count </th>
        <td mat-cell *matCellDef="let element"> {{element.winnerCount}} </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
